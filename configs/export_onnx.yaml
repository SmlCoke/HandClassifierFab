# HCF ONNX Export Configuration
# =============================

# Model architecture (must match the checkpoint; version must match too)
# version: "v1" = mobilenet_v3_small/large | "v2" = v2_* architectures
model:
  version: "v1"
  architecture: "mobilenet_v3_small"
  num_handedness: 2
  num_presence: 2
  input_channels: 1
  pretrained: false

# ONNX export settings
export:
  onnx_opset: 13
  dynamic_batch: true

# Output paths
paths:
  checkpoint_dir: "../autodl-tmp/TrainFab/outputs/checkpoints"
  metrics_dir: "../autodl-tmp/TrainFab/outputs/train"
  splits_dir: "../autodl-tmp/TrainFab/outputs"
