# HCF Training Configuration
# ========================

# Data sources and split strategy
data:
  train_sources:
    - ../autodl-tmp/DatasetFab/HCFTrainSource/*
    - ../autodl-tmp/DatasetFab/HCFTrainSource/NegativeTrain/*
  val_sources:
    - ../autodl-tmp/DatasetFab/HCFEvalSource/complex-near-bright-random-test-s01-peak
    - ../autodl-tmp/DatasetFab/HCFEvalSource/complex-mid-bright-random-val-s01-peak
    - ../autodl-tmp/DatasetFab/HCFEvalSource/NegativeVal/*
  test_sources: []
  split:
    val_ratio: 0.1
    test_ratio: 0.0
    seed: 42
    stratified: true

# Model architecture
model:
  architecture: "mobilenet_v3_small"
  num_handedness: 2
  num_presence: 2
  input_channels: 1
  pretrained: true

# Training hyperparameters
training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.0001
  head_lr_multiplier: 10
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stopping_patience: 15
  class_weights: "balanced"
  amp: true
  num_workers: 4

# Hand presence multi-task weight
hand_presence:
  loss_weight: 1.0

# Data augmentation
augmentation:
  horizontal_flip_prob: 0.5
  rotation_degrees: 10
  translate: [0.1, 0.1]
  scale: [0.9, 1.1]
  brightness: 0.2
  contrast: 0.2
  random_erasing_prob: 0.3

# Output paths
paths:
  checkpoint_dir: "../autodl-tmp/TrainFab/outputs/checkpoints"
  metrics_dir: "../autodl-tmp/TrainFab/outputs/train"
  splits_dir: "../autodl-tmp/TrainFab/outputs"
