# HCF Training Configuration
# ========================

# Data sources and split strategy
data:
  train_sources:
    - ../autodl-tmp/DatasetFab/HCFTrainSource/*
    - ../autodl-tmp/DatasetFab/HCFTrainSource/NegativeTrain/*
  # Glob patterns: new sources dropped into HCFEvalSource/ are picked
  # up automatically on the next run (no config edit needed)
  val_sources:
    - ../autodl-tmp/DatasetFab/HCFEvalSource/*
    - ../autodl-tmp/DatasetFab/HCFEvalSource/NegativeVal/*
  test_sources: []
  split:
    val_ratio: 0.1
    test_ratio: 0.0
    seed: 42
    stratified: true

# Model architecture
# version: "v1" = original MobileNetV3 series (mobilenet_v3_small/large)
#          "v2" = accuracy-first series (see models/v2/):
#            v2_convnet_s (~13M), v2_convnet_l (~64M), v2_multibranch (~15M),
#            v2_hybrid_s (~16M), v2_hybrid_l (~41M), v2_resnet50 (~24M),
#            v2_convnext_tiny (~28M), v2_efficientnet_v2_s (~20M),
#            v2_vit_b16 (~86M)
# v2 custom CNNs/hybrids are trained from scratch; v2 transfer models
# (resnet50/convnext_tiny/efficientnet_v2_s/vit_b16) use ImageNet
# pretrained weights when pretrained: true
model:
  version: "v1"
  architecture: "mobilenet_v3_small"
  num_handedness: 2
  num_presence: 2
  input_channels: 1
  pretrained: true

# Training hyperparameters
training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.0001
  head_lr_multiplier: 10
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stopping_patience: 15
  class_weights: "balanced"
  amp: true
  num_workers: 4

# Hand presence multi-task weight
hand_presence:
  loss_weight: 1.0

# Per-batch sampling ratios (training only; the validation set is used as-is).
# The no_hand pool is much larger than the has_hand pool, so plain random
# sampling would let no_hand samples dominate every batch and skew the hand
# presence head. When this section exists, every training batch is composed
# of exactly round(batch_size * no_hand_ratio) no_hand samples, with the
# remaining has_hand samples split Left/Right by left_right_ratio
# (unknown-handedness has_hand samples are used as fallback). Class weights
# are then derived from these ratios instead of the raw dataset counts.
sampling:
  enabled: true
  no_hand_ratio: 0.3            # 每个 batch 中 no_hand 样本的目标占比（0~1）
  left_right_ratio: [0.5, 0.5]  # 有手样本中 Left / Right 的目标占比（和为 1）

# Data augmentation
augmentation:
  horizontal_flip_prob: 0.5
  rotation_degrees: 10
  translate: [0.1, 0.1]
  scale: [0.9, 1.1]
  brightness: 0.2
  contrast: 0.2
  random_erasing_prob: 0.3

# Output paths. When output_root is set, all training/evaluation/export
# artifacts are organized as <output_root>/<model.version>/<model.architecture>/,
# so different model series/architectures never overwrite each other:
#   checkpoints/best.pth, last.pth | train/metrics.jsonl | eval/val_metrics.json
#   | splits.json | model.onnx
paths:
  output_root: "../autodl-tmp/TrainFab/outputs"
