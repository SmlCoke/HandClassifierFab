# HCF Evaluation Configuration
# ===========================

# Model architecture (must match the checkpoint; version must match too)
# version: "v1" = mobilenet_v3_small/large | "v2" = v2_* architectures
model:
  version: "v1"
  architecture: "mobilenet_v3_small"
  num_handedness: 2
  num_presence: 2
  input_channels: 1
  pretrained: false

# Data sources for evaluation (globs pick up new sources automatically)
data:
  val_sources:
    - ../autodl-tmp/DatasetFab/HCFEvalSource/*
    - ../autodl-tmp/DatasetFab/HCFEvalSource/NegativeVal/*
  test_sources: []

# DataLoader settings (shared with training)
training:
  batch_size: 64
  num_workers: 4
  amp: false

# Output paths. output_root organizes artifacts per model
# (<output_root>/<version>/<architecture>/); see train.yaml.
paths:
  output_root: "../autodl-tmp/TrainFab/outputs"
