# Hand Left/Right Binary Classifier (HCF) Configuration
# Dual-head: handedness (Left/Right) + hand_presence (no_hand/has_hand)
# ====================================================================

# Data sources and split strategy
data:
  # Source directories containing images/ and cvat_reviewed.xml (or cvat_autolabel.xml)
  # Supports glob patterns for matching multiple directories on the server
  # Paths are relative to the repo root (~/HandClassifierFab)
  # Image-only dirs (no XML) are treated as negative (no_hand) samples
  train_sources:
    - ../autodl-tmp/DatasetFab/HCFTrainSource/*
    - ../autodl-tmp/DatasetFab/HCFTrainSource/NegativeTrain/*
  # Pre-defined validation sources (excluded from train_sources automatically)
  val_sources:
    - ../autodl-tmp/DatasetFab/HCFEvalSource/complex-near-bright-random-test-s01-peak
    - ../autodl-tmp/DatasetFab/HCFEvalSource/complex-mid-bright-random-val-s01-peak
    - ../autodl-tmp/DatasetFab/HCFEvalSource/NegativeVal/*
  # test_sources: leave empty for now; add future manually-annotated test sources here
  test_sources: []

  split:
    val_ratio: 0.1
    test_ratio: 0.0      # No test split for current datasets
    seed: 42
    stratified: true

# Model architecture
model:
  architecture: "mobilenet_v3_small"   # or mobilenet_v3_large
  num_handedness: 2
  num_presence: 2
  input_channels: 1
  pretrained: true

# Training hyperparameters
training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.0001         # Backbone learning rate
  head_lr_multiplier: 10        # Classifier head lr = lr * this
  weight_decay: 0.0001
  warmup_epochs: 5
  early_stopping_patience: 15
  class_weights: "balanced"     # "balanced", null, or [w0, w1]
  amp: true                     # Automatic mixed precision (GPU only)
  num_workers: 4

# Hand presence task settings
hand_presence:
  loss_weight: 1.0              # Weight of presence loss in total loss

# Data augmentation (applied to training set only)
augmentation:
  horizontal_flip_prob: 0.5     # RandomHorizontalFlip + label swap
  rotation_degrees: 10          # RandomAffine rotation range
  translate: [0.1, 0.1]         # RandomAffine translate range
  scale: [0.9, 1.1]             # RandomAffine scale range
  brightness: 0.2               # ColorJitter brightness
  contrast: 0.2                 # ColorJitter contrast
  random_erasing_prob: 0.3      # RandomErasing probability

# ONNX export settings
export:
  onnx_opset: 13
  dynamic_batch: true

# CVAT label export test settings
cvat_label_test:
  # Source directory containing images/ and cvat_autolabel.xml
  source_dir: "../autodl-tmp/DatasetFab/HCFCVATTestSource/dataset_source"
  # Output filename (saved alongside the source XML, original cvat_autolabel.xml unchanged)
  output_filename: "cvat_hcf.xml"

# Output paths (relative to repo root)
paths:
  checkpoint_dir: "../autodl-tmp/TrainFab/outputs/checkpoints"
  metrics_dir: "../autodl-tmp/TrainFab/outputs/train"
  splits_dir: "../autodl-tmp/TrainFab/outputs"
